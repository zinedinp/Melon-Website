<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="rind" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9dff6a"/><stop offset="1" stop-color="#1e9d4a"/></linearGradient>
    <linearGradient id="flesh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fa3"/><stop offset="1" stop-color="#ff2a4a"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <g transform="rotate(-28 32 34)">
    <!-- Kontur -->
    <path d="M4 26A28 28 0 0 0 60 26Z" fill="#0a2a6b" stroke="#0a2a6b" stroke-width="6" stroke-linejoin="round"/>
