    <g fill="#0a2a6b" shape-rendering="crispEdges"><rect x="19" y="31" width="4" height="4"/><rect x="30" y="35" width="4" height="4"/><rect x="40" y="31" width="4" height="4"/><rect x="28" y="43" width="4" height="4"/></g>
    <!-- Glanz -->
    <path d="M11 26A21 21 0 0 0 53 26Z" fill="url(#shine)" opacity=".5" transform="translate(0 -4) scale(1 .45)" style="transform-origin:32px 26px"/>
    <path d="M6 24H58" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".9"/>
  </g>
